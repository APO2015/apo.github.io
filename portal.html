<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>APO Client Portal</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--brand:#15507f;--sky:#1aa7f5;--ok:#16a34a;--warn:#f59e0b;--bad:#dc2626;--shadow:0 6px 24px rgba(15,23,42,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--ink:#e8eef9;--mute:#94a3b8;--line:#243049;--shadow:0 6px 24px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,sans-serif;line-height:1.5;padding:0 16px 40px}
.wrap{max-width:760px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 8px}
header h1{font-size:18px;margin:0;color:var(--brand)}
@media (prefers-color-scheme:dark){header h1{color:var(--sky)}}
.lang{display:flex;gap:6px}
.lang button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.lang button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
h2{font-size:15px;margin:22px 4px 6px;color:var(--mute);font-weight:700;letter-spacing:.2px}
.hello{font-size:20px;font-weight:800;margin:4px 0 2px}
.sub{color:var(--mute);font-size:13px}
input{width:100%;font-size:22px;letter-spacing:4px;text-align:center;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);direction:ltr;text-transform:uppercase}
input:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(26,167,245,.25)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:700;background:var(--brand);color:#fff;cursor:pointer;text-decoration:none}
.btn.wa{background:#16a34a}
.btn.alt{background:var(--card);color:var(--brand);border:1.5px solid var(--brand)}
@media (prefers-color-scheme:dark){.btn.alt{color:var(--sky);border-color:var(--sky)}}
.btn[disabled]{opacity:.65;cursor:wait}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin .8s linear infinite}
.ok{color:var(--ok);text-align:center;margin-top:8px;font-size:13.5px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.no{font-weight:800;font-size:16px}
.pill{display:inline-block;border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap}
.kv{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:13.5px;color:var(--mute)}
.kv b{color:var(--ink);font-weight:600}
.stage{margin-top:8px;font-size:13.5px}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--sky))}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;text-align:center}
.money div{background:var(--bg);border-radius:10px;padding:8px 4px}
.money small{display:block;color:var(--mute);font-size:11.5px}
.money strong{font-size:14.5px;direction:ltr;display:block}
.err{color:var(--bad);text-align:center;margin-top:10px;font-size:14px}
.empty{color:var(--mute);text-align:center;padding:14px;font-size:14px}
footer{text-align:center;color:var(--mute);font-size:12px;margin-top:26px}
.ltr{direction:ltr;unicode-bidi:isolate}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">APO Digital Lab</h1>
    <div class="lang" id="lang"></div>
  </header>
  <div id="app"></div>
  <footer id="foot"></footer>
</div>
<script>
(function () {
  'use strict';
  var SUPABASE_URL = 'https://ijhkzkufnewlkuxoqcim.supabase.co';
  var ANON_KEY = 'sb_publishable_0X9fbtIUmWVwb4GunSbt6A_v72zvU1M';

  var T = {
    ar: { name: 'العربية', portal: 'بوابة العميل', enter: 'أدخل كود العميل', code: 'الكود', open: 'عرض', bad: 'الكود غير صحيح', typo: 'الكود فيه خطأ كتابة، تأكد منه أو امسح الـQR مجدداً', blocked: 'محاولات كثيرة. حاول مجدداً بعد %m دقيقة', loading: 'جارٍ التحديث…', refreshed: 'تم التحديث', net: 'تعذّر الاتصال، حاول لاحقاً',
      hello: 'أهلاً', cases: 'حالاتك', invoices: 'فواتيرك', none_c: 'لا توجد حالات', none_i: 'لا توجد فواتير', case: 'حالة', patient: 'المريض', received: 'الاستلام',
      due: 'الموعد', delivered: 'التسليم', stage: 'المرحلة الحالية', trial: 'في التجربة', inv: 'فاتورة', issued: 'التاريخ', total: 'الإجمالي', paid: 'المدفوع', remaining: 'المتبقي',
      wa: 'تواصل مع المعمل عبر واتساب', refresh: 'تحديث', upd: 'آخر تحديث', logout: 'خروج', readonly: 'هذه الصفحة للاطلاع فقط.',
      st: { received: 'تم الاستلام', design: 'التصميم', milling: 'قيد التصنيع', finishing: 'اللمسات الأخيرة', ready: 'جاهزة', delivered: 'تم التسليم', cancelled: 'ملغاة' },
      ist: { issued: 'غير مدفوعة', partial: 'مدفوعة جزئياً', paid: 'مدفوعة' },
      wt: { crown: 'تاج', bridge: 'جسر', veneer: 'فينير', denture: 'طقم كامل', partial: 'طقم جزئي', implant: 'زرعة', nightguard: 'واقي ليلي', ortho: 'جهاز تقويم', other: 'أخرى' } },
    en: { name: 'English', portal: 'Client portal', enter: 'Enter your client code', code: 'Code', open: 'Open', bad: 'Invalid code', typo: 'The code has a typing mistake. Check it or scan the QR again', blocked: 'Too many attempts. Try again in %m minute(s)', loading: 'Refreshing…', refreshed: 'Updated', net: 'Connection failed, try again later',
      hello: 'Hello', cases: 'Your cases', invoices: 'Your invoices', none_c: 'No cases', none_i: 'No invoices', case: 'Case', patient: 'Patient', received: 'Received',
      due: 'Due', delivered: 'Delivered', stage: 'Current stage', trial: 'In trial', inv: 'Invoice', issued: 'Date', total: 'Total', paid: 'Paid', remaining: 'Remaining',
      wa: 'Contact the lab on WhatsApp', refresh: 'Refresh', upd: 'Last update', logout: 'Sign out', readonly: 'This page is read-only.',
      st: { received: 'Received', design: 'Design', milling: 'In production', finishing: 'Finishing', ready: 'Ready', delivered: 'Delivered', cancelled: 'Cancelled' },
      ist: { issued: 'Unpaid', partial: 'Partially paid', paid: 'Paid' },
      wt: { crown: 'Crown', bridge: 'Bridge', veneer: 'Veneer', denture: 'Full denture', partial: 'Partial denture', implant: 'Implant', nightguard: 'Night guard', ortho: 'Ortho appliance', other: 'Other' } },
    fr: { name: 'Français', portal: 'Espace client', enter: 'Saisissez votre code client', code: 'Code', open: 'Ouvrir', bad: 'Code incorrect', typo: 'Le code contient une erreur de saisie. Vérifiez-le ou rescannez le QR', blocked: 'Trop de tentatives. Réessayez dans %m minute(s)', loading: 'Actualisation…', refreshed: 'Actualisé', net: 'Connexion impossible, réessayez plus tard',
      hello: 'Bonjour', cases: 'Vos dossiers', invoices: 'Vos factures', none_c: 'Aucun dossier', none_i: 'Aucune facture', case: 'Dossier', patient: 'Patient', received: 'Reçu le',
      due: 'Échéance', delivered: 'Livré le', stage: 'Étape en cours', trial: 'En essayage', inv: 'Facture', issued: 'Date', total: 'Total', paid: 'Payé', remaining: 'Reste à payer',
      wa: 'Contacter le laboratoire sur WhatsApp', refresh: 'Actualiser', upd: 'Dernière mise à jour', logout: 'Quitter', readonly: 'Cette page est en lecture seule.',
      st: { received: 'Reçu', design: 'Conception', milling: 'En production', finishing: 'Finition', ready: 'Prêt', delivered: 'Livré', cancelled: 'Annulé' },
      ist: { issued: 'Non payée', partial: 'Partiellement payée', paid: 'Payée' },
      wt: { crown: 'Couronne', bridge: 'Bridge', veneer: 'Facette', denture: 'Prothèse complète', partial: 'Prothèse amovible partielle', implant: 'Implant', nightguard: 'Gouttière occlusale', ortho: 'Appareil orthodontique', other: 'Autre' } }
  };
  var COLORS = { received: '#6b7c93', design: '#7e57c2', milling: '#1e88e5', finishing: '#f59e0b', ready: '#16a34a', delivered: '#0f766e', cancelled: '#dc2626' };
  var ICOL = { issued: '#dc2626', partial: '#f59e0b', paid: '#16a34a' };
  var ORDER = ['received', 'design', 'milling', 'finishing', 'ready', 'delivered'];

  var q = new URLSearchParams(location.search);
  var lang = (q.get('l') || localStorage.getItem('apo_portal_lang') || (navigator.language || 'ar').slice(0, 2)).toLowerCase();
  if (!T[lang]) lang = 'ar';
  var ALPHA = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';
  // يوحّد ما كُتب أو مُسح (يقبل صيغة الـQR الكاملة APO-CLI:...)
  function normCode(v) {
    var s = String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (s.length === 24 && s.indexOf('APOCLI') === 0) s = s.slice(6);
    return s;
  }
  // حرف التحقق: مطابق تماماً لدالة apo_code_chk في SQL ولـLabCode في التطبيق
  function chk(s) {
    var t = 0;
    for (var i = 0; i < s.length; i++) {
      var ch = s.charAt(i), v = ALPHA.indexOf(ch);
      if (v < 0) v = ch === '0' ? 30 : (ch === '1' ? 29 : 0);
      t = (t + v * (i + 1)) % 31;
    }
    return ALPHA.charAt(t);
  }
  function codeOk(c) { return c.length === 18 && /^[2-9A-HJKMNP-Z]+$/.test(c) && chk(c.slice(0, 17)) === c.charAt(17); }
  var code = normCode(q.get('c') || sessionStorage.getItem('apo_portal_code') || '');
  var data = null, error = '', loading = false, note = '';
  var $app = document.getElementById('app');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function t() { return T[lang]; }
  function fmtDate(v) { if (!v) return ''; var d = new Date(v); if (isNaN(d)) return esc(v); return d.toLocaleDateString(lang === 'ar' ? 'ar' : lang, { year: 'numeric', month: '2-digit', day: '2-digit' }); }
  var lastAt = null;
  function fmtTime(v) { var d = new Date(v); if (isNaN(d)) return ''; return d.toLocaleTimeString(lang === 'ar' ? 'ar' : lang, { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
  function fmtMoney(n, cur) { var v = Number(n || 0); var dec = /^(IQD|LBP|SYP|YER|SOS|DJF|KMF)$/.test(cur) ? 0 : (/^(BHD|KWD|OMR|JOD|TND|LYD)$/.test(cur) ? 3 : 2); return v.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + ' ' + esc(cur); }

  function applyLang() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.getElementById('title').textContent = (data && data.lab && data.lab.name) ? data.lab.name : 'APO Digital Lab';
    document.title = t().portal;
    var L = document.getElementById('lang'); L.innerHTML = '';
    Object.keys(T).forEach(function (k) {
      var b = document.createElement('button'); b.textContent = T[k].name; if (k === lang) b.className = 'on';
      b.onclick = function () { lang = k; try { localStorage.setItem('apo_portal_lang', k); } catch (e) {} render(); };
      L.appendChild(b);
    });
    document.getElementById('foot').textContent = t().readonly;
  }

  function loginView() {
    return '<div class="card"><div class="hello">' + esc(t().portal) + '</div><div class="sub">' + esc(t().enter) + '</div>' +
      '<form id="f"><input id="c" autocomplete="off" autocapitalize="characters" maxlength="40" placeholder="XXXXX-XXXXXXXXXXXX-X" inputmode="text" spellcheck="false" value="' + esc(code) + '">' +
      '<button class="btn" type="submit">' + esc(t().open) + '</button></form>' +
      (error ? '<div class="err">' + esc(error) + '</div>' : '') + '</div>';
  }

  function caseCard(c) {
    var st = c.status || 'received', idx = ORDER.indexOf(st), pct = st === 'cancelled' ? 0 : Math.round(((idx < 0 ? 0 : idx) + 1) / ORDER.length * 100);
    var h = '<div class="card"><div class="row"><div><div class="no">' + esc(t().case) + ' #' + esc(c.case_no) + '</div><div class="sub">' + esc(t().wt[c.work_type] || c.work_type || '') + '</div></div>' +
      '<span class="pill" style="background:' + (COLORS[st] || '#64748b') + '">' + esc(t().st[st] || st) + '</span></div>';
    if (st !== 'cancelled') h += '<div class="bar"><i style="width:' + pct + '%"></i></div>';
    if (c.stage || c.in_trial) h += '<div class="stage">' + (c.in_trial ? '⏱ ' + esc(t().trial) : '▸ ' + esc(t().stage) + ': <b>' + esc(c.stage) + '</b>') + '</div>';
    h += '<div class="kv">';
    if (c.patient) h += '<span>' + esc(t().patient) + ': <b>' + esc(c.patient) + '</b></span>';
    if (c.received_at) h += '<span>' + esc(t().received) + ': <b>' + fmtDate(c.received_at) + '</b></span>';
    if (c.due_date && st !== 'delivered') h += '<span>' + esc(t().due) + ': <b>' + fmtDate(c.due_date) + '</b></span>';
    if (c.delivered_at) h += '<span>' + esc(t().delivered) + ': <b>' + fmtDate(c.delivered_at) + '</b></span>';
    return h + '</div></div>';
  }

  function invCard(i) {
    var s = i.status || 'issued';
    return '<div class="card"><div class="row"><div><div class="no">' + esc(t().inv) + ' #' + esc(i.invoice_no) + '</div><div class="sub">' + esc(t().issued) + ': ' + fmtDate(i.issued_at) + (i.due_at ? ' · ' + esc(t().due) + ': ' + fmtDate(i.due_at) : '') + '</div></div>' +
      '<span class="pill" style="background:' + (ICOL[s] || '#64748b') + '">' + esc(t().ist[s] || s) + '</span></div>' +
      '<div class="money"><div><small>' + esc(t().total) + '</small><strong>' + fmtMoney(i.total, i.currency) + '</strong></div>' +
      '<div><small>' + esc(t().paid) + '</small><strong>' + fmtMoney(i.paid, i.currency) + '</strong></div>' +
      '<div><small>' + esc(t().remaining) + '</small><strong>' + fmtMoney(i.remaining, i.currency) + '</strong></div></div></div>';
  }

  function dataView() {
    var h = '<div class="card"><div class="hello">' + esc(t().hello) + ' ' + esc(data.client.name) + '</div><div class="sub">' + esc(t().upd) + ': ' + fmtDate(data.at) + ' ' + fmtTime(lastAt || data.at) + '</div>';
    var wa = data.lab && data.lab.whatsapp ? String(data.lab.whatsapp).replace(/[^0-9]/g, '') : '';
    if (wa) h += '<a class="btn wa" href="https://wa.me/' + wa + '" target="_blank" rel="noopener">💬 ' + esc(t().wa) + '</a>';
    h += '<button class="btn alt" id="rf"' + (loading ? ' disabled' : '') + '>' + (loading ? '<span class="spin">⟳</span> ' + esc(t().loading) : '⟳ ' + esc(t().refresh)) + '</button>' + (note ? '<div class="' + (note === 'ok' ? 'ok' : 'err') + '">' + esc(note === 'ok' ? t().refreshed : note) + '</div>' : '') + '</div>';
    h += '<h2>' + esc(t().cases) + '</h2>' + (data.cases.length ? data.cases.map(caseCard).join('') : '<div class="card empty">' + esc(t().none_c) + '</div>');
    h += '<h2>' + esc(t().invoices) + '</h2>' + (data.invoices.length ? data.invoices.map(invCard).join('') : '<div class="card empty">' + esc(t().none_i) + '</div>');
    return h;
  }

  function render() {
    applyLang();
    $app.innerHTML = data ? dataView() : loginView();
    var f = document.getElementById('f');
    if (f) f.onsubmit = function (e) { e.preventDefault(); code = normCode(document.getElementById('c').value); load(false); };
    var rf = document.getElementById('rf'); if (rf) rf.onclick = function () { load(true); };
  }

  function load(isRefresh) {
    error = ''; note = '';
    if (!codeOk(code)) { data = null; error = code ? (code.length === 18 ? t().typo : t().bad) : ''; render(); return; }
    if (isRefresh && data) { loading = true; render(); }
    var started = Date.now();
    fetch(SUPABASE_URL + '/rest/v1/rpc/portal_get', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY },
      body: JSON.stringify({ p_code: code })
    }).then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); })
      .then(function (j) {
        var wait = isRefresh ? Math.max(0, 450 - (Date.now() - started)) : 0;   // يبقى المؤشر ظاهراً لحظة كي يلاحظه المستخدم
        setTimeout(function () {
          loading = false;
          if (j && j.blocked) { error = t().blocked.replace('%m', Math.max(1, Math.ceil((j.retry_after || 60) / 60))); if (!isRefresh) data = null; else { data = data; note = error; error = ''; } }
          else if (!j) { data = null; error = t().bad; try { sessionStorage.removeItem('apo_portal_code'); } catch (e) {} }
          else { data = j; lastAt = new Date(); if (isRefresh) note = 'ok'; try { sessionStorage.setItem('apo_portal_code', code); } catch (e) {} if (history.replaceState) history.replaceState(null, '', location.pathname + '?l=' + lang); }
          render();
        }, wait);
      })
      .catch(function () { loading = false; if (isRefresh && data) { note = t().net; } else { data = null; error = t().net; } render(); });
  }

  render();
  if (code.length > 0 && codeOk(code)) load(false);
})();
</script>
</body>
</html>
