<html lang="ar" dir="rtl">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Client Portal</title>
<link rel="manifest" href="portal.webmanifest">
<meta name="theme-color" content="#15507f">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--brand:#15507f;--sky:#1aa7f5;--ok:#16a34a;--warn:#f59e0b;--bad:#dc2626;--shadow:0 6px 24px rgba(15,23,42,.08)}
:root[data-theme="dark"]{--bg:#0b1220;--card:#131c2e;--ink:#e8eef9;--mute:#94a3b8;--line:#243049;--shadow:0 6px 24px rgba(0,0,0,.4)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c2e;--ink:#e8eef9;--mute:#94a3b8;--line:#243049;--shadow:0 6px 24px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,sans-serif;line-height:1.5;padding:0 16px 40px}
.wrap{max-width:760px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 8px}
header .brand{display:flex;align-items:center;gap:10px;min-width:0}
header .logo{width:44px;height:44px;border-radius:12px;object-fit:contain;background:#fff;border:1px solid rgba(128,128,128,.35);flex:none}
header h1{font-size:18px;margin:0;color:var(--brand)}
:root[data-theme="dark"] header h1{color:var(--sky)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header h1{color:var(--sky)}}
.lang{display:flex;gap:6px;flex-wrap:wrap}
.lang button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.lang button.th{padding:5px 10px}
.lang button:hover{border-color:var(--sky);box-shadow:0 0 12px rgba(26,167,245,.35)}
.lang button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
h2{font-size:15px;margin:22px 4px 6px;color:var(--mute);font-weight:700;letter-spacing:.2px}
.hello{font-size:20px;font-weight:800;margin:4px 0 2px}
.sub{color:var(--mute);font-size:13px}
input{width:100%;font-size:22px;letter-spacing:4px;text-align:center;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);direction:ltr;text-transform:uppercase}
input:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(26,167,245,.25)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:700;background:var(--brand);color:#fff;cursor:pointer;text-decoration:none}
.btn.wa{background:#16a34a}
.btn.alt{background:var(--card);color:var(--brand);border:1.5px solid var(--brand)}
:root[data-theme="dark"] .btn.alt{color:var(--sky);border-color:var(--sky)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.alt{color:var(--sky);border-color:var(--sky)}}
.btn[disabled]{opacity:.65;cursor:wait}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin .8s linear infinite}
.ok{color:var(--ok);text-align:center;margin-top:8px;font-size:13.5px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.no{font-weight:800;font-size:16px}
.pill{display:inline-block;border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap}
.kv{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:13.5px;color:var(--mute)}
.kv b{color:var(--ink);font-weight:600}
.stage{margin-top:8px;font-size:13.5px}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--sky))}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;text-align:center}
.money div{background:var(--bg);border-radius:10px;padding:8px 4px}
.money small{display:block;color:var(--mute);font-size:11.5px}
.money strong{font-size:14.5px;direction:ltr;display:block}
.err{color:var(--bad);text-align:center;margin-top:10px;font-size:14px}
.empty{color:var(--mute);text-align:center;padding:14px;font-size:14px}
footer{text-align:center;color:var(--mute);font-size:12px;margin-top:26px}
.ltr{direction:ltr;unicode-bidi:isolate}
.trial{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.trial .q{font-weight:700;font-size:14px;margin-bottom:8px}
.trial .two{display:flex;gap:8px}
.trial .two button{flex:1;border:0;border-radius:12px;padding:12px;font-size:15px;font-weight:700;color:#fff;cursor:pointer}
.trial .two .a{background:var(--ok)}.trial .two .r{background:var(--bad)}
.trial textarea{width:100%;min-height:76px;margin-top:8px;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;resize:vertical}
.trial .send{display:flex;gap:8px;margin-top:8px}
.trial .send button{flex:1;border:0;border-radius:12px;padding:11px;font-size:14.5px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
.trial .send button.x{background:var(--card);color:var(--mute);border:1.5px solid var(--line)}
.trial .done{font-size:13.5px;padding:9px 11px;border-radius:10px;background:var(--bg)}
.trial .done b.a{color:var(--ok)}.trial .done b.r{color:var(--bad)}
</style>
</head>

      return h + '</div>';
    }
    if (prev) h += '<div class="done">' + esc(t().tlast) + ': <b class="' + (prev.decision === 'accept' ? 'a' : 'r') + '">' + esc(prev.decision === 'accept' ? t().tacc : t().trej) + '</b>' + (prev.note ? ' — ' + esc(prev.note) : '') + ' <span class="sub">(' + fmtDate(prev.at) + ')</span></div>';
    else h += '<div class="q">' + esc(t().tq) + '</div>';
    h += '<div class="two" style="margin-top:8px"><button class="a" data-d="accept" data-n="' + esc(n) + '">' + esc(t().ta) + '</button><button class="r" data-d="reject" data-n="' + esc(n) + '">' + esc(t().tr) + '</button></div>';
    if (tMsg) h += '<div class="ok">' + esc(tMsg) + '</div>';
    return h + '</div>';
  }

  function invCard(i) {
    var s = i.status || 'issued';
    return '<div class="card"><div class="row"><div><div class="no">' + esc(t().inv) + ' #' + esc(i.invoice_no) + '</div><div class="sub">' + esc(t().issued) + ': ' + fmtDate(i.issued_at) + (i.due_at ? ' · ' + esc(t().due) + ': ' + fmtDate(i.due_at) : '') + '</div></div>' +
      '<span class="pill" style="background:' + (ICOL[s] || '#64748b') + '">' + esc(t().ist[s] || s) + '</span></div>' +
      '<div class="money"><div><small>' + esc(t().total) + '</small><strong>' + fmtMoney(i.total, i.currency) + '</strong></div>' +
      '<div><small>' + esc(t().paid) + '</small><strong>' + fmtMoney(i.paid, i.currency) + '</strong></div>' +
      '<div><small>' + esc(t().remaining) + '</small><strong>' + fmtMoney(i.remaining, i.currency) + '</strong></div></div></div>';
  }

  function dataView() {
    var h = '<div class="card"><div class="hello">' + esc(t().hello) + ' ' + esc(data.client.name) + '</div><div class="sub">' + esc(t().upd) + ': ' + fmtDate(data.at) + ' ' + fmtTime(lastAt || data.at) + '</div>';
    var wa = data.lab && data.lab.whatsapp ? String(data.lab.whatsapp).replace(/[^0-9]/g, '') : '';
    if (wa) h += '<a class="btn wa" href="https://wa.me/' + wa + '" target="_blank" rel="noopener">💬 ' + esc(t().wa) + '</a>';
    h += '<button class="btn alt" id="rf"' + (loading ? ' disabled' : '') + '>' + (loading ? '<span class="spin">⟳</span> ' + esc(t().loading) : '⟳ ' + esc(t().refresh)) + '</button>' + (note ? '<div class="' + (note === 'ok' ? 'ok' : 'err') + '">' + esc(note === 'ok' ? t().refreshed : note) + '</div>' : '') + '</div>';
    h += '<h2>' + esc(t().cases) + '</h2>' + (data.cases.length ? data.cases.map(caseCard).join('') : '<div class="card empty">' + esc(t().none_c) + '</div>');
    h += '<h2>' + esc(t().invoices) + '</h2>' + (data.invoices.length ? data.invoices.map(invCard).join('') : '<div class="card empty">' + esc(t().none_i) + '</div>');
    return h;
  }

  function render() {
    applyLang();
    $app.innerHTML = data ? dataView() : loginView();
    var f = document.getElementById('f');
    if (f) f.onsubmit = function (e) { e.preventDefault(); code = normCode(document.getElementById('c').value); load(false); };
    var ci = document.getElementById('c');
    if (ci) ci.oninput = function () { var v = normCode(ci.value); if (codeOk(v)) { var old = code; code = v; loadLogo(); if (old !== v) { /* لا نغيّر المحتوى أثناء الكتابة */ } } };
    var sb = document.getElementById('scanbtn'); if (sb) sb.onclick = function () { if (window.APO_PWA) window.APO_PWA.scan(); };
    var rf = document.getElementById('rf'); if (rf) rf.onclick = function () { load(true); };
    Array.prototype.forEach.call(document.querySelectorAll('.trial .two button'), function (b) {
      b.onclick = function () { tOpen = b.getAttribute('data-n'); tDec = b.getAttribute('data-d'); tMsg = ''; render(); };
    });
    var tc = document.getElementById('tc'); if (tc) tc.onclick = function () { tOpen = null; tMsg = ''; render(); };
    var ts = document.getElementById('ts'); if (ts) ts.onclick = sendTrial;
  }

  function rpc(name, body) {
    return fetch(SUPABASE_URL + '/rest/v1/rpc/' + name, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY },
      body: JSON.stringify(body)
    }).then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); });
  }
  /* شعار المعمل بجانب اسمه (SQL 50). مرة واحدة لكل كود؛ الفشل صامت ولا يؤثر على البوابة. */
  var logoFor = '';
  function loadLogo() {
    if (!codeOk(code) || logoFor === code) return; logoFor = code;
    fetch(SUPABASE_URL + '/rest/v1/rpc/portal_lab_logo', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY },
      body: JSON.stringify({ p_code: code })
    }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      if (!j) { logoFor = ''; return; }
      var nb = { name: String(j.name || ''), logo: '' };
      if (j.logo) { var b = String(j.logo); nb.logo = b.indexOf('data:') === 0 ? b : 'data:image/' + (b.indexOf('/9j/') === 0 ? 'jpeg' : 'png') + ';base64,' + b; }
      brand = nb;
      try { if (nb.logo.length < 900000) localStorage.setItem('apo_cli_brand', JSON.stringify(nb)); } catch (e) {}
      applyLang();
    }).catch(function () { logoFor = ''; });
  }
  function loadTrials() {
    rpc('portal_trials', { p_code: code }).then(function (j) {
      var m = {};
      if (j && j.items) j.items.forEach(function (x) { m[String(x.case_no)] = x; });
      trials = m; if (data) render();
    }).catch(function () {});
  }
  function sendTrial() {
    var note = (document.getElementById('tn').value || '').trim();
    if (tDec === 'reject' && !note) { tMsg = t().tnoter; render(); return; }
    tBusy = true; tMsg = ''; render();
    rpc('portal_trial_respond', { p_code: code, p_case_no: parseInt(tOpen, 10), p_decision: tDec, p_note: note })
      .then(function (j) {
        tBusy = false;
        if (j && j.ok) { tOpen = null; tMsg = t().tdone; loadTrials(); render(); return; }
        var e = j && j.error;
        tMsg = j && j.blocked ? t().blocked.replace('%m', Math.max(1, Math.ceil((j.retry_after || 60) / 60))) : e === 'too_many' ? t().tmany : e === 'not_in_trial' ? t().tnot : e === 'note_required' ? t().tnoter : t().net;
        render();
      }).catch(function () { tBusy = false; tMsg = t().net; render(); });
  }

  function load(isRefresh) {
    error = ''; note = '';
    if (!codeOk(code)) { data = null; error = code ? (code.length === 18 ? t().typo : t().bad) : ''; render(); return; }
    if (isRefresh && data) { loading = true; render(); }
    var started = Date.now();
    fetch(SUPABASE_URL + '/rest/v1/rpc/portal_get', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY },
      body: JSON.stringify({ p_code: code })
    }).then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); })
      .then(function (j) {
        var wait = isRefresh ? Math.max(0, 450 - (Date.now() - started)) : 0;   // يبقى المؤشر ظاهراً لحظة كي يلاحظه المستخدم
        setTimeout(function () {
          loading = false;
          if (j && j.blocked) { error = t().blocked.replace('%m', Math.max(1, Math.ceil((j.retry_after || 60) / 60))); if (!isRefresh) data = null; else { data = data; note = error; error = ''; } }
          else if (!j) { data = null; error = t().bad; try { sessionStorage.removeItem('apo_portal_code'); } catch (e) {} }
          else { data = j; lastAt = new Date(); if (isRefresh) note = 'ok'; try { sessionStorage.setItem('apo_portal_code', code); } catch (e) {} loadTrials(); loadLogo(); if (history.replaceState) history.replaceState(null, '', location.pathname + '?l=' + lang); }
          render();
        }, wait);
      })
      .catch(function () { loading = false; if (isRefresh && data) { note = t().net; } else { data = null; error = t().net; } render(); });
  }

  render();
  if (code.length > 0 && codeOk(code)) { loadLogo(); load(false); }
})();
</script>
<script src="apo_pwa.js"></script>
</body>
</html>
