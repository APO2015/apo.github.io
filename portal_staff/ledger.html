      materials: 'Matières', equipment: 'Équipements', electricity: 'Électricité', water: 'Eau', internet: 'Internet et téléphone', rent: 'Loyer', taxes: 'Impôts et taxes', maintenance: 'Maintenance', transport: 'Transport',

  };
  var A = APO_STAFF, c = A.ctx, t = c.t, esc = c.esc;

  var CFG = window.APO_STAFF_CFG, tab = 'sum', q = '', flt = 'unpaid', ME = null, D = null, lowOnly = false;
  var STC = { draft: '#6b7c93', issued: '#dc2626', partial: '#f59e0b', paid: '#16a34a', cancelled: '#64748b' };
  var CATS = ['materials', 'equipment', 'electricity', 'water', 'internet', 'rent', 'taxes', 'maintenance', 'transport', 'other'];

  /* ---- المال: نفس منطق التطبيق ---- */
  function dec(code) { return ['BHD', 'KWD', 'OMR', 'JOD', 'TND', 'LYD'].indexOf(code) >= 0 ? 3 : 2; }
  function trim0(code) { return ['IQD', 'LBP', 'SYP', 'YER', 'SOS', 'DJF', 'KMF'].indexOf(code) >= 0; }
  function money(v, code) {
    var d = dec(code), s = Math.abs(v).toFixed(d);
    if (trim0(code) && s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    var p = s.split('.'); p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    var sign = (v < 0 && /[1-9]/.test(s)) ? '-' : '';
    return '<span class="num">' + sign + p[0] + (p[1] ? '.' + p[1] : '') + ' ' + esc(code) + '</span>';
  }
  function tol(code) { var x = 0.5, i; for (i = 0; i < dec(code || 'USD'); i++) x /= 10; return x; }
  function totals(inv, itemsKey) {
    var its = inv[itemsKey] || [], sub = 0;
    its.forEach(function (i) { sub += (Number(i.qty) || 1) * (Number(i.unit_price) || 0); });
    var taxable = Math.max(sub - (Number(inv.discount) || 0), 0), total = taxable + taxable * (Number(inv.tax_percent) || 0) / 100, paid = Number(inv.paid) || 0;
    return { sub: sub, total: total, paid: paid, rem: total - paid };
  }
  function hasOpen(status, rem, cur) { return status !== 'draft' && status !== 'cancelled' && rem > tol(cur); }
  function ymd(d) { return c.fmtDate(d); }
  function monthKey(d) { return String(d || '').slice(0, 7); }
  function curMonth() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); }
  var NOWM = curMonth(), salMonth = NOWM;
  function num(v) { var x = Number(v); return isFinite(x) ? x : 0; }
  function parseAmt(raw) { return parseFloat(String(raw || '').trim().replace(/[٠-٩]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); }).replace(',', '.')); }

  /* ---- دفتر الديون (مطابق لـ debts_service.dart) ---- */
  function dayNum(s) { var d = new Date(s); if (isNaN(d)) return null; return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000); }
  function ageDays(due) { if (!due) return null; var a = dayNum(new Date()) - dayNum(due); return a < 0 ? null : a; }
  function bucket(due) { var a = ageDays(due); if (a === null) return 0; return a <= 30 ? 1 : a <= 60 ? 2 : a <= 90 ? 3 : 4; }
  function buildDebts(d) {
    var deliv = {}, recvd = {}, limits = {};
    d.cases.forEach(function (r) { if (r.delivered_at) deliv[r.id] = r.delivered_at; });
    d.ocases.forEach(function (r) { if (r.received_at) recvd[r.id] = r.received_at; });
    d.clients.forEach(function (r) { var l = Number(r.credit_limit); if (l > 0) limits['c:' + r.id] = { amount: l, cur: r.currency || 'USD' }; });
    d.labs.forEach(function (r) { var l = Number(r.credit_limit); if (l > 0 && r.credit_currency) limits['o:' + r.id] = { amount: l, cur: r.credit_currency }; });
    function dueOf(m, items, map) {
      if (m.due_at) return m.due_at;
      var ids = (items || []).map(function (i) { return i.case_id || i.outgoing_case_id; }).filter(Boolean);
      if (!ids.length) return m.issued_at;
      var ds = ids.map(function (id) { return map[id]; }).filter(Boolean).sort();
      return ds.length ? ds[0] : null;
    }
    var recv = [], pay = [];
    d.inv.forEach(function (i) { var T = totals(i, 'invoice_items'); if (hasOpen(i.status, T.rem, i.currency)) recv.push({ inv: i, party: i.client_id, name: (i.clients && i.clients.name) || '—', cur: i.currency || 'USD', rem: T.rem, due: dueOf(i, i.invoice_items, deliv), out: false }); });
    d.out.forEach(function (o) { var T = totals(o, 'outgoing_invoice_items'); if (hasOpen(o.status, T.rem, o.currency)) pay.push({ inv: o, party: o.external_lab_id, name: (o.external_labs && o.external_labs.name) || '—', cur: o.currency || 'USD', rem: T.rem, due: dueOf(o, o.outgoing_invoice_items, recvd), out: true }); });
    return { recv: recv, pay: pay, limits: limits };
  }
  function byCurrency(items) { var m = {}; items.forEach(function (x) { var e = m[x.cur] = m[x.cur] || { total: 0, b: [0, 0, 0, 0, 0], n: 0 }; e.total += x.rem; e.b[bucket(x.due)] += x.rem; e.n++; }); return m; }
  function byParty(items, limits) {
    var m = {};
    items.forEach(function (x) { var k = x.party + '|' + x.cur, e = m[k] = m[k] || { name: x.name, cur: x.cur, total: 0, n: 0, oldest: 0, lim: limits[(x.out ? 'o:' : 'c:') + x.party] }; e.total += x.rem; e.n++; var a = ageDays(x.due) || 0; if (a > e.oldest) e.oldest = a; });
    return Object.keys(m).map(function (k) { return m[k]; }).sort(function (a, b) { return b.total - a.total; });
  }

  CFG.identify = function (ctx) {
    return ctx.get('technicians?select=*&user_id=eq.' + ctx.uid() + '&deleted_at=is.null&limit=1').then(function (rows) {
      var r = rows && rows[0];
      if (!r) return { error: 'notfound' };
      if (r.kind !== 'accountant') return { error: 'wrongrole' };
      if (r.active === false) return { error: 'suspended' };
      ME = r; CFG._me = { id: r.id, name: r.full_name };
      return ctx.get('labs?select=name,portal_name&limit=1').then(function (l) { if (l && l[0]) CFG._lab = l[0].portal_name || l[0].name; return null; }).catch(function () { return null; });
    });
  };

  function soft(p) { return p.catch(function (e) { if (e && e.message === 'session') throw e; return []; }); }
  CFG.load = function (ctx) {
    return Promise.all([
      ctx.get('invoices?select=*,clients(name),invoice_items(*)&deleted_at=is.null&order=invoice_no.desc&limit=1500'),
      ctx.get('payments?select=*&order=paid_at.desc&limit=5000'),
      ctx.get('expenses?select=*&deleted_at=is.null&order=spent_at.desc&limit=800'),
      ctx.get('outgoing_invoices?select=*,external_labs(name),outgoing_invoice_items(*)&deleted_at=is.null&order=invoice_no.desc&limit=800'),
      soft(ctx.get('cases?select=id,delivered_at&delivered_at=not.is.null&deleted_at=is.null&limit=20000')),
      soft(ctx.get('outgoing_cases?select=id,received_at&received_at=not.is.null&deleted_at=is.null&limit=20000')),
      soft(ctx.get('clients?select=id,credit_limit,currency&deleted_at=is.null&limit=5000')),
      soft(ctx.get('external_labs?select=id,credit_limit,credit_currency&deleted_at=is.null&limit=2000')),
      soft(ctx.get('employees?select=*&deleted_at=is.null&order=full_name.asc&limit=500')),
      soft(ctx.get('salary_payments?select=*&deleted_at=is.null&order=paid_at.desc&limit=6000')),
      soft(ctx.get('inventory?select=*&deleted_at=is.null&order=name.asc&limit=3000')),
      soft(ctx.get('currencies?select=code,per_usd&order=code.asc&limit=100'))
    ]).then(function (r) {
      var payBy = {}; (r[1] || []).forEach(function (p) { (payBy[p.invoice_id] = payBy[p.invoice_id] || []).push(p); });
      D = { inv: r[0] || [], pay: r[1] || [], payBy: payBy, exp: r[2] || [], out: r[3] || [], cases: r[4], ocases: r[5], clients: r[6], labs: r[7], emps: r[8], sal: r[9], stock: r[10], curs: r[11] && r[11].length ? r[11] : [{ code: 'USD', per_usd: 1 }] };
      D.debts = buildDebts(D);
      return D;
    });
  };

  function stPill(s) { var k = s === 'paid' ? 'paidSt' : s; return '<span class="pill" style="background:' + (STC[s] || '#64748b') + '">' + esc(t(k)) + '</span>'; }
  function byCur(list, fn) { var m = {}; list.forEach(function (x) { var cc = x.currency || x.cur || 'USD'; m[cc] = (m[cc] || 0) + fn(x); }); return m; }
  function curBlock(label, m, cls) {
    var ks = Object.keys(m).filter(function (k) { return Math.abs(m[k]) > 0.0000001; });
    return '<div class="stat"><div class="l">' + esc(label) + '</div>' + (ks.length ? ks.map(function (k) { return '<div class="big ' + (cls || '') + '">' + money(m[k], k) + '</div>'; }).join('') : '<div class="big">—</div>') + '</div>';
  }
  var BNAMES = ['notDue', 'b1', 'b2', 'b3', 'b4'];

  function summary(d) {
    var live = d.inv.filter(function (i) { return i.status !== 'draft' && i.status !== 'cancelled'; });
    var rem = {}, remOut = {};
    d.debts.recv.forEach(function (x) { rem[x.cur] = (rem[x.cur] || 0) + x.rem; });
    d.debts.pay.forEach(function (x) { remOut[x.cur] = (remOut[x.cur] || 0) + x.rem; });
    var inv = byCur(live, function (i) { return totals(i, 'invoice_items').total; });
    var col = byCur(live, function (i) { return num(i.paid); });
    var invMap = {}; d.inv.forEach(function (i) { invMap[i.id] = i; });
    var mp = {}; d.pay.forEach(function (p) { if (monthKey(p.paid_at) === NOWM) { var i = invMap[p.invoice_id]; var cc = (i && i.currency) || 'USD'; mp[cc] = (mp[cc] || 0) + num(p.amount); } });
    var me = {}; d.exp.forEach(function (e) { if (monthKey(e.spent_at) === NOWM) { var cc = e.currency || 'USD'; me[cc] = (me[cc] || 0) + num(e.amount); } });
    return '<div class="grid" style="margin-top:12px">' + curBlock(t('receivable') + ' (' + d.debts.recv.length + ')', rem, 'red') + curBlock(t('payable') + ' (' + d.debts.pay.length + ')', remOut, 'red') + curBlock(t('invoiced'), inv) + curBlock(t('collected'), col, 'grn') + curBlock(t('monthPaid'), mp, 'grn') + curBlock(t('monthExp'), me) + '</div>';
  }

  function debtSection(title, items, limits) {
    var byc = byCurrency(items), parties = byParty(items, limits), ks = Object.keys(byc);
    var h = '<h2>' + esc(title) + ' (' + items.length + ')</h2>';
    if (!items.length) return h + '<div class="empty">' + esc(t('noDebt')) + '</div>';
    ks.forEach(function (k) {
      var e = byc[k];
      h += '<div class="card"><div class="row"><b class="big red" style="font-size:18px">' + money(e.total, k) + '</b><span class="sub">' + e.n + ' ' + esc(t('invoicesN')) + '</span></div><div class="kv">' + e.b.map(function (v, i) { return v > tol(k) ? '<span>' + esc(t(BNAMES[i])) + ': <b>' + money(v, k) + '</b></span>' : ''; }).join('') + '</div></div>';
    });
    var ql = q.trim().toLowerCase();

    body.querySelectorAll('[data-out]').forEach(function (el) { el.onclick = function () { openInvoice(el.getAttribute('data-out'), 'out'); }; });
    var ae = body.querySelector('#addexp'); if (ae) ae.onclick = expForm;
    var mp = body.querySelector('#mprev'); if (mp) mp.onclick = function () { salMonth = monthShift(salMonth, -1); rr(); };
    var mn = body.querySelector('#mnext'); if (mn) mn.onclick = function () { salMonth = monthShift(salMonth, 1); rr(); };
    body.querySelectorAll('[data-sal]').forEach(function (b) { b.onclick = function () { var e = d.emps.filter(function (x) { return x.id === b.getAttribute('data-sal'); })[0]; if (e) salForm(e); }; });
    body.querySelectorAll('[data-st]').forEach(function (b) { b.onclick = function () { var it = d.stock.filter(function (x) { return String(x.id) === b.getAttribute('data-id'); })[0]; if (it) stockForm(it, b.getAttribute('data-st')); }; });
  };

  CFG.codeLen = 18;
  CFG.icon = '📒';
  CFG.title = { ar: 'بوابة المحاسب', en: 'Accountant Ledger', fr: 'Poste du comptable' };
  A.start();
})();
</script>
